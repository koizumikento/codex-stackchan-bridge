name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  stackchanctl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Lint stackchanctl
        run: uv run --directory apps/stackchanctl ruff check .
      - name: Test stackchanctl
        run: uv run --directory apps/stackchanctl python -m unittest discover -s tests
      - name: Smoke mock backend
        run: uv run --directory apps/stackchanctl stackchanctl --backend mock --source test face happy --json

  ros-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Check stackchan_msgs contracts
        run: uv run python scripts/check_ros_interfaces.py

  bridge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Lint stackchan_bridge
        run: uv run --directory ros/stackchan_bridge --no-project --with ruff ruff check .
      - name: Test stackchan_bridge facade
        run: uv run --directory ros/stackchan_bridge --no-project python -m unittest discover -s tests

  ros2-container-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build ROS 2 container image
        run: uv run --no-project python scripts/ros2_container.py build-image
      - name: Run no-device ROS 2 bridge smoke
        run: uv run --no-project python scripts/ros2_container.py smoke

  firmware-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Check firmware contracts
        run: uv run python -m unittest discover -s firmware/m5stackchan-microros/tests
      - name: Build firmware container image
        run: uv run --no-project python scripts/firmware_container.py build-image
      - name: Build firmware
        run: uv run --no-project python scripts/firmware_container.py build
