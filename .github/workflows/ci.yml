name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  stackchanctl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Lint stackchanctl
        run: uv run --directory apps/stackchanctl ruff check .
      - name: Test stackchanctl
        run: uv run --directory apps/stackchanctl python -m unittest discover -s tests
      - name: Smoke mock backend
        run: uv run --directory apps/stackchanctl stackchanctl --backend mock --source test face happy --json

  ros-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Check stackchan_msgs contracts
        run: uv run python scripts/check_ros_interfaces.py

  bridge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Lint stackchan_bridge
        run: uv run --directory ros/stackchan_bridge ruff check .
      - name: Test stackchan_bridge facade
        run: uv run --directory ros/stackchan_bridge python -m unittest discover -s tests

  firmware-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Check firmware contracts
        run: uv run python -m unittest discover -s firmware/m5stackchan-microros/tests
